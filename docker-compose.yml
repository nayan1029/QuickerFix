version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: quickerfix-db
    restart: always
    environment:
      POSTGRES_DB: quickerfix_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quickerfix-backend
    restart: always
    depends_on:
      - db
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/quickerfix_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:3000,http://localhost:80
    volumes:
      - backend_uploads:/app/uploads
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quickerfix-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  backend_uploads:
